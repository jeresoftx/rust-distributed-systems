[package]
name = "rust-distributed-systems"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeresoftx/rust-distributed-systems"
description = "Sistemas distribuidos en Rust para Jeresoft Academy."
readme = "README.md"

[lib]
name = "rust_distributed_systems"
path = "src/lib.rs"

[dependencies]

[[example]]
name = "consensus_basic_majority"
path = "examples/soluciones/consensus_basic_majority.rs"

[[example]]
name = "consensus_intermediate_failure"
path = "examples/soluciones/consensus_intermediate_failure.rs"

[[example]]
name = "consensus_advanced_conflict"
path = "examples/soluciones/consensus_advanced_conflict.rs"

[[example]]
name = "consensus_real_config"
path = "examples/soluciones/consensus_real_config.rs"

[[example]]
name = "raft_basic_election"
path = "examples/soluciones/raft_basic_election.rs"

[[example]]
name = "raft_intermediate_commit"
path = "examples/soluciones/raft_intermediate_commit.rs"

[[example]]
name = "raft_advanced_log_conflict"
path = "examples/soluciones/raft_advanced_log_conflict.rs"

[[example]]
name = "raft_real_replicated_config"
path = "examples/soluciones/raft_real_replicated_config.rs"

[[bench]]
name = "consensus_bench"
path = "benches/consensus_bench.rs"
harness = false

[[bench]]
name = "raft_bench"
path = "benches/raft_bench.rs"
harness = false
